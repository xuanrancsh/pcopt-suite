name: 📜 规则包提案
description: 提议新增或修改一条 tweak 规则（YAML）
title: "[Rule] "
labels: ["rules"]
body:
  - type: markdown
    attributes:
      value: |
        规则包（tweak）贡献流程见 [CONTRIBUTING.md](../../CONTRIBUTING.md) 第 7 节。
        本模板用于**提出并评审**规则，正式贡献请同时提交 `rules/tweaks/<id>.yaml` 的 PR。

  - type: input
    id: rule_id
    attributes:
      label: 规则 Id
      description: 格式为「分类.对象.动作」，如 svc.sysmain.disable
      placeholder: game.power.plan.high.perf
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: 一句话名称（displayName）
      description: 面向玩家的人话标题
      placeholder: 切换到高性能电源计划
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 风险等级（risk）
      options:
        - Safe（安全：无副作用或极轻微）
        - Notice（注意：有可见的代价/取舍，如耗电增加）
        - Danger（危险：影响安全/隐私/稳定性，默认折叠）
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: 该规则解决什么问题 / 作用原理
      description: 说明原理与依据（引用官方文档或可靠来源更佳）
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: 代价与副作用（consequenceHints）
      description: 用白话说明可能的代价，避免夸大收益
      placeholder: |
        - 笔记本续航会短一些
        - 退出后会自动切回原来的电源计划
    validations:
      required: true

  - type: textarea
    id: actions
    attributes:
      label: 动作（actions）
      description: 列出该规则将执行的动作（类型 + 关键参数）
      render: yaml
      placeholder: |
        - type: PowerCfg
          kind: SetActive
          argument: 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
    validations:
      required: true

  - type: dropdown
    id: reversible
    attributes:
      label: 是否可还原
      description: 所有动作都必须能按快照还原（"有 Apply 必有 Revert"）
      options:
        - 可还原（推荐）
        - 不确定（请在正文说明）
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 验证证据（可选）
      description: 如实测数据、参考链接、截图
    validations:
      required: false

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 该规则不涉及游戏文件/进程、不伪造硬件信息、不引入遥测
          required: true
        - label: 我已阅读 CONTRIBUTING.md 的规则评审要点（说人话 / 风险分级 / 可还原）
          required: true
