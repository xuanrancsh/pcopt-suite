name: 🐞 Bug 报告
description: 报告崩溃、还原不彻底、UI 异常或行为不符预期的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了尽快定位问题，请尽量填写完整。
        ⚠️ **系统级工具**：若问题涉及"改了没还原/系统异常"，请先阅读第 4 节的排查提示。
        🔒 若是**安全漏洞**，请勿在此公开，请按 SECURITY.md 私下上报。

  - type: dropdown
    id: product
    attributes:
      label: 涉及的产品
      description: 问题出现在哪个产品？（可先选最主要的，其余写正文）
      options:
        - 产品 A · GameModePilot（自动调度）
        - 产品 B · GameOptBox（优化全家桶）
        - 产品 C · FrameLab（帧率诊断）
        - 共享内核 / 多个产品 / 不确定
    validations:
      required: true

  - type: input
    id: product_version
    attributes:
      label: 产品版本
      description: 例如 v0.1.0（可在"设置/关于"查看），或填提交号
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows 版本与 Build
      description: 运行 `winver` 查看，例如「Windows 11 23H2 (22631.4890)」
      placeholder: Windows 11 23H2 (22631.4890)
    validations:
      required: true

  - type: input
    id: dotnet_runtime
    attributes:
      label: .NET 运行时版本
      description: 运行 `dotnet --list-runtimes` 查看；框架依赖包需 .NET 9 Desktop Runtime
      placeholder: Microsoft.WindowsDesktop.App 9.0.x
    validations:
      required: false

  - type: dropdown
    id: admin
    attributes:
      label: 是否以管理员身份运行
      description: 部分系统级调整需要管理员权限
      options:
        - 是（管理员）
        - 否（普通用户）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述，越具体越好
      placeholder: |
        1. 打开产品 B → 规则浏览器
        2. 搜索「电源」并应用「切换到高性能电源计划」
        3. 点击「还原中心」→ 全部还原
        4. 观察到 ……（期望 vs 实际）
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 期望行为 vs 实际行为
      placeholder: |
        期望：……
        实际：……
    validations:
      required: true

  # ⭐ 关键排查项：还原日志是否残留
  - type: dropdown
    id: journal_residue
    attributes:
      label: 还原日志（Journal）是否残留？
      description: |
        这是个关键排查项。查看目录 `%ProgramData%\pcopt\journal`：
        - 若你已"全部还原/退出程序"，该目录应只剩**已关闭(Closed/Recovered)**的会话；
        - 若存在**仍为 Open** 的会话，说明可能存在"未完全还原"。
        请如实选择；不确定可先选"不确定"，并在正文贴出该目录的文件名（不要贴内容）。
      options:
        - 无残留（目录为空或仅已关闭会话）
        - 有 Open 会话残留（疑似未完全还原）
        - 不确定 / 未检查
    validations:
      required: true

  - type: input
    id: anti_cheat
    attributes:
      label: 当时是否运行了带反作弊的游戏
      description: 如 Vanguard / EAC / BattlEye / RICOCHET / ACE 等；没有则填"无"
      placeholder: 无 / Vanguard / EAC
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        产品日志位于 `%LocalAppData%\pcopt\<产品名>\logs\`。
        请**先检查**是否包含用户名/路径等隐私信息，自行脱敏后再粘贴。
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏（可选）
      description: 直接拖拽图片到此处
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 显卡型号、是否笔记本、是否装了安全软件、是否可稳定复现等
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现相同问题
          required: true
        - label: 我已确认日志中不含我的隐私信息（或已脱敏）
          required: true
        - label: 我知道这**不是**安全漏洞报告（安全漏洞按 SECURITY.md 私下上报）
          required: true
