name: 💡 功能建议
description: 提出新功能或体验改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明"要解决什么问题"，而不只是"要什么功能"，这样更利于评估与实现。

  - type: dropdown
    id: product
    attributes:
      label: 关联产品
      options:
        - 产品 A · GameModePilot（自动调度）
        - 产品 B · GameOptBox（优化全家桶）
        - 产品 C · FrameLab（帧率诊断）
        - 共享内核 / 通用 / 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你在使用中遇到的不便或痛点
      placeholder: 每次优化后我都记不住改了哪些项，想知道……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你期望的功能形态（若已想好）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考（可选）
      description: 你在其他工具里见过的做法，或相关链接
    validations:
      required: false

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 我的建议不涉及游戏进程注入、硬件伪装、遥测或 GPL 系代码引入
          required: true
        - label: 我已搜索过现有 Issue / Discussions，未发现重复建议
          required: true
