id: game.capture.appcapture.disable
category: 游戏
risk: Safe
displayName: 关闭应用捕获后台功能
description: 关掉系统级"捕获"后台，减少游戏时的后台编码与内存占用。
consequenceHints:
  - 录屏快捷键将无效
conditions:
  - minBuild: 19041
actions:
  - type: RegistrySet
    path: HKCU\Software\Microsoft\Windows\CurrentVersion\GameDVR
    name: AppCaptureEnabled
    value: 0
    valueKind: DWord
