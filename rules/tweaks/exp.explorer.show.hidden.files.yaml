id: exp.explorer.show.hidden.files
category: 体验
risk: Notice
displayName: 显示隐藏文件
description: 让资源管理器显示隐藏文件与文件夹，方便清理配置残留。
consequenceHints:
  - 系统隐藏文件也会显示出来，请勿随意删除
  - 退出后会自动还原
conditions:
  - minBuild: 19041
actions:
  - type: RegistrySet
    path: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: Hidden
    value: 1
    valueKind: DWord
