# pcopt-suite 游戏数据库（架构 3.4 / T7）
# 字段说明：
#   id              游戏唯一 Id（小写英文，社区 PR 增补时保持稳定）
#   name            中文人话名（PRD 5.3）
#   executables     可执行文件名（不含路径，ETW 匹配用；大小写不敏感）
#   platforms       通常安装平台（Steam/Epic/Gog/Xbox/WeGame/Unknown=平台外启动器如 Riot/Battle.net）
#   antiCheat       已知反作弊产品（None|Vac|EasyAntiCheat|BattlEye|Vanguard|Ricochet|TencentAce|Faceit|Unknown）
#                   —— Unknown = 已知使用反作弊但不在特征库覆盖范围；运行时以 T9 检测为准
#   recommendedTier 推荐硬件档位（Low|Mid|High|Ultra；T6 HardwareTierEstimator 输出对齐）
# 维护规范：新增游戏必须提供确定的可执行文件名；不确定的宁可暂不收录（ETW 误匹配比漏匹配更糟）。

